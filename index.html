<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Funnel Webhook Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">funnel-webhook-demo</p>
      <h1>Lead &amp; order capture</h1>
      <p class="lede">
        Submit a lead. JavaScript validates the form, then posts JSON to a PHP webhook.
      </p>
    </header>

    <form id="lead-form" class="form" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" required />
        <p class="error" data-error-for="name" hidden></p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
        <p class="error" data-error-for="email" hidden></p>
      </div>

      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+1 555 0100" />
        <p class="error" data-error-for="phone" hidden></p>
      </div>

      <div class="field">
        <label for="product">Product</label>
        <select id="product" name="product" required>
          <option value="">Select a product</option>
          <option value="starter">Starter plan - $29</option>
          <option value="growth">Growth plan - $79</option>
          <option value="pro">Pro plan - $149</option>
        </select>
        <p class="error" data-error-for="product" hidden></p>
      </div>

      <div class="field">
        <label for="notes">Notes (optional)</label>
        <textarea id="notes" name="notes" rows="3" maxlength="500"></textarea>
      </div>

      <button type="submit" id="submit-btn">Send to webhook</button>
    </form>

    <section class="result" aria-live="polite">
      <h2>Response</h2>
      <pre id="response-box">Submit the form to see the webhook response.</pre>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
